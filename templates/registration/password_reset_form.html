{% extends 'app_sigrams/base.html' %}
{% block title %}Recuperar contraseña - SIGRAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow border-catamarca">
      <div class="card-header bg-catamarca text-white text-center">
        <h4 class="mb-0">🔑 Recuperar contraseña</h4>
      </div>
      <div class="card-body p-4">
        <p class="text-muted mb-3">
          Ingresá el email de tu cuenta y te enviaremos un enlace para restablecer tu contraseña.
        </p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label">Email</label>
            <input type="email" name="email" id="id_email"
                   class="form-control" placeholder="tu@email.com" required>
          </div>
          <button type="submit" class="btn btn-catamarca w-100">
            Enviar enlace de recuperación
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'login' %}" class="text-muted small">← Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
